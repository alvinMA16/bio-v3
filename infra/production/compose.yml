name: bio-v3
services:
  api:
    image: bio-v3:${BIO_RELEASE:?set BIO_RELEASE}
    build:
      context: ../..
      dockerfile: infra/production/Dockerfile
      args:
        BIO_COMMIT: ${BIO_RELEASE}
    env_file:
      - ${BIO_ENV_FILE:?set BIO_ENV_FILE}
    ports:
      - "127.0.0.1:3100:3000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - /srv/bio-v3/data/agent:/data/agent
    restart: unless-stopped
    mem_limit: 1g
    cpus: 1.5
    stop_grace_period: 45s
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/v1/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: bio
      POSTGRES_USER: bio
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - /srv/bio-v3/data/postgres:/var/lib/postgresql/data
    restart: unless-stopped
    mem_limit: 512m
    cpus: 1
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bio -d bio"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
